name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auth config validation
        run: npm --prefix apps/web run auth:check -- --strict --production
        env:
          APP_AUTH_SECRET: ci-app-auth-secret
          MAGIC_LINK_SECRET: ci-magic-link-secret
          APP_BASE_URL: https://example.com
          GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build
        env:
          APP_AUTH_SECRET: ci-app-auth-secret
          MAGIC_LINK_SECRET: ci-magic-link-secret
          APP_BASE_URL: https://example.com
          GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com

      - name: Validate content
        run: npm run validate:content
